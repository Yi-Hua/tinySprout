<!-- app.component.html -->
<div class="app-container">
  <header class="header">
    <h1 class="title">Tiny Sprout</h1>
    <p class="subtitle">Every bite counts. 🌱</p>
  </header>

  <div class="stats-grid">
    <div class="stat-card">
      <span class="stat-label">今日累計</span>
      <div class="stat-value">
        <span class="big-num">{{ totalAmount }}</span>
        <span class="unit">g</span>
      </div>
    </div>

    <div class="stat-card">
      <span class="stat-label">上次餵食</span>
      <div class="stat-value">
        <span class="time-text">{{ timeSinceLastFeeding }}</span>
      </div>
    </div>
  </div>

  <mat-card class="input-card">
    <mat-card-content>
      <div class="form-wrapper">

        <mat-form-field appearance="outline">
          <mat-label>選擇食材</mat-label>
          <mat-select #foodSelect value="地瓜">
            <mat-option value="地瓜">地瓜 🍠</mat-option>
            <mat-option value="蓮藕">蓮藕 🥗</mat-option>
            <mat-option value="南瓜">南瓜 🎃</mat-option>
            <mat-option value="白米">白米 🍚</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>份量</mat-label>
          <input matInput type="number" #amountInput value="15">
          <span matSuffix class="unit-label" style="margin-right: 12px;">g</span>
        </mat-form-field>

        <div style="display: flex; gap: 10px;">

          <mat-form-field appearance="outline" style="flex: 1;">
            <mat-label>日期</mat-label>
            <input matInput type="date"
                  [(ngModel)]="currentDate"
                  (change)="onDateChange()">
          </mat-form-field>

          <mat-form-field appearance="outline" style="flex: 1;">
            <mat-label>時間</mat-label>
            <input matInput type="time" [(ngModel)]="currentTime">
            <mat-icon matSuffix>access_time</mat-icon>
          </mat-form-field>

        </div>

        <button mat-flat-button class="submit-btn"
          [disabled]="isSaving"
          (click)="save(foodSelect.value, +amountInput.value, amountInput)">
          {{ isSaving ? '儲存中...' : '添加這一口' }}
        </button>

      </div>
    </mat-card-content>
  </mat-card>

  <section class="history-section">
    <div class="list-header">
      <h3 class="list-title">{{'今日足跡 🐾  '+ currentDate}}</h3>
      <span class="total-badge">Total: {{logs.length}}</span>
    </div>
    <div *ngIf="logs.length > 0; else noData">
      <div *ngFor="let log of logs" class="log-item">
        <div class="log-info">
          <div class="food-name">{{ log.food_name }}</div>
          <div class="timestamp">{{ log.created_at | date:'HH:mm' }} 錄入</div>
        </div>
        <div class="amount-display">
          {{ log.amount }}<span class="unit">g</span>
        </div>
        <button mat-icon-button class="delete-btn" (click)="deleteLog(log.id)">
          <mat-icon>delete_outline</mat-icon>
        </button>
      </div>
    </div>
    <ng-template #noData>
      <div class="empty-state">
        <mat-icon>spa</mat-icon>
        <p>今天還沒有紀錄喔，準備好開飯了嗎？</p>
      </div>
    </ng-template>
  </section>
</div>
